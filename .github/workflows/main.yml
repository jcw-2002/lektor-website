name: Deploy site

on:
  push:
    branches:
      - main  # 如果默认分支是 master，请改成 master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 完整拉取 Git 历史（防止部分页面因缺少 git 记录报错）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装 uv 包管理器
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 4. 自动安装 Python 和 Webpack 的所有依赖
      - name: Install dependencies
        run: |
          uv sync
          if [ -d "webpack" ]; then npm --prefix webpack install; fi
          if [ -f "package.json" ]; then npm install; fi

      # 5. 编译静态网站
      - name: Build site with Lektor & Webpack
        run: |
          uv run lektor build -f webpack --output-path ./dist

      # 6. 生成 Pagefind 全站搜索索引
      #    必须放在 lektor build 之后、上传 dist 之前：它会读取 dist 里的 HTML，
      #    并写出 dist/pagefind/（pagefind-ui.js / pagefind-ui.css / 索引分片）。
      #    Node.js 已在上面的 setup-node 步骤装好，npx 会临时拉取 pagefind CLI。
      #    --glob 排除 dist/_404.html/（Lektor 给 404 页附件建的目录，名字以 .html
      #    结尾会被默认 glob 当成网页，导致一条 "failed to read" 噪音报错）。
      - name: Build search index with Pagefind
        run: |
          npx -y pagefind --site ./dist --glob "**/[!_]*.html"

      # 7. 导出博客纯文本/Markdown 数据（whale_agent 博客知识库的数据源）
      - name: Export blog data for Whale Agent
        run: |
          uv run python scripts/export_blog_data.py --site-url https://wanjc.top --output ./dist_blog_data

      # 8. 同步网站到 Ubuntu 服务器
      - name: Deploy to Ubuntu Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/wanjc.top"
          EXCLUDE: "/dist/, /node_modules/"

      # 9. 同步博客数据到 whale_agent 数据目录
      #    注意：目标必须是独立目录，不能放进 /var/www/wanjc.top（会被上一步 --delete 清掉）
      #    --chmod 保证以 root 推送时 wjc 用户依然可读
      - name: Deploy blog data to Whale Agent
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete --chmod=D755,F644"
          SOURCE: "dist_blog_data/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/home/wjc/blog_data"
