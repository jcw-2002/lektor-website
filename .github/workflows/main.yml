name: Deploy site

on:
  push:
    branches:
      - main  # 如果默认分支是 master，请改成 master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 完整拉取 Git 历史（防止部分页面因缺少 git 记录报错）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装 uv 包管理器
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 4. 自动安装 Python 和 Webpack 的所有依赖
      - name: Install dependencies
        run: |
          uv sync
          if [ -d "webpack" ]; then npm --prefix webpack install; fi
          if [ -f "package.json" ]; then npm install; fi

      # 5. 编译静态网站
      - name: Build site with Lektor & Webpack
        run: |
          uv run lektor build -f webpack --output-path ./dist

      # 6. 同步到 Ubuntu 服务器
      - name: Deploy to Ubuntu Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/wanjc.top"
          EXCLUDE: "/dist/, /node_modules/"
