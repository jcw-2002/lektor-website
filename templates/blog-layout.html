{% extends "layout.html" %}
{% block title %}The Transcript{% endblock %}
{% block outerbody %}
  {% set image = site.get('/blog').attachments.images.first() %}
  {% if image %}
    <div class="page-banner page-banner-300" style="background-image: url({{ image|url }})"></div>
  {% endif %}
  {{ super() }}
{% endblock %}
{% block body %}
  <div class="row">
    <div class="col-sm-12">
      {% block blog_body %}{% endblock %}
    </div>
  </div>
{% endblock %}
