[model]
name = Gallery
label = {{ this.name or "Gallery" }}
hidden = yes

[children]
model = gallery-item
order_by = name

[fields.name]
label = Name
description = Shown as the title/cover of this gallery when it is nested.
type = string
size = large

[fields.cover_image]
label = Cover Image
description = Preview thumbnail shown when this gallery is nested in a parent.
type = select
source = record.attachments.images
width = 1/2

[fields.columns]
label = Columns
description = Number of items per row (1-6). Defaults to 5.
type = integer
width = 1/2
