[model]
name = Section Page
label = {{ this.title }}

[children]
model = section-page
order_by = sort_key, title

[fields.title]
label = Title
type = string
size = large

[fields.sort_key]
label = Sort key
type = sort_key
width = 1/2

[fields.root_path]
label = Root Path
description = Path to this column's root page (e.g. /python/). Leave empty on the root page itself.
type = string
width = 1/2

[fields.summary]
label = Summary
type = string
width = 1/2
description = 首页/列表卡片上的摘要，留空则自动截取正文前 90 字

[fields.pub_date]
label = Publication date
type = date
width = 1/4

[fields.pinned]
label = Pin to top
type = boolean
default = false
width = 1/4
description = 勾选后会在首页「精选推荐」区块展示（只取最新的一篇）

[fields.category]
label = Category
description = 顶层分组名（如 Python、Hexo、博客）。留空则归入"未分类"组别，且始终显示。
type = string
width = 1/2

[fields.body]
label = Body
type = markdown
