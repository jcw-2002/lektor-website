[model]
name = Blog Post
label = {{ this.title }}
hidden = yes

[fields.title]
label = Title
type = string
size = large

[fields.author]
label = Author
type = string
width = 1/2

[fields.twitter_handle]
label = Twitter Handle
type = string
width = 1/4
addon_label = @

[fields.pub_date]
label = Publication date
type = date
width = 1/4

[fields.summary]
label = Summary
type = text
description = 首页/列表卡片上的摘要，留空则自动截取正文前 90 字

[fields.pinned]
label = Pin to top
type = boolean
default = false
width = 1/4
description = 勾选后会在首页「精选推荐」区块展示（只取最新的一篇）

[fields.body]
label = Body
type = flow
flow_blocks = banner, text-block
